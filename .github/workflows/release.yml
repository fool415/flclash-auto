name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 钉住 FlClash 官方版本:同一 tag 重跑时资产内容必须一致,不随上游 latest 漂移。
  # 升级 FlClash 时改这里(并同步更新 THIRD_PARTY_NOTICES.md 说明)。
  FLCLASH_TAG: v0.9.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 解析钉住版本的 FlClash release 里 Windows 便携版(amd64) 的下载地址
      #    (带 GITHUB_TOKEN 避免匿名 API 限流;钉版本保证同 tag 重跑资产不漂移)
      - name: Resolve pinned FlClash Windows portable asset
        id: flclash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/chen08209/FlClash/releases/tags/${FLCLASH_TAG}" -o flclash.json
          url=$(jq -r '.assets[] | select(.name | endswith("windows-amd64.zip")) | .browser_download_url' flclash.json | head -n1)
          name=$(jq -r '.assets[] | select(.name | endswith("windows-amd64.zip")) | .name' flclash.json | head -n1)
          if [ -z "$url" ] || [ -z "$name" ]; then
            echo "::error::FlClash ${FLCLASH_TAG} 未找到 windows-amd64.zip 资产,可能资产命名已变更(或该版本未提供 Windows 便携版)"
            exit 1
          fi
          if [ "$(jq -r '.tag_name' flclash.json)" != "${FLCLASH_TAG}" ]; then
            echo "::error::解析到的 tag 与钉住的 FLCLASH_TAG 不一致"
            exit 1
          fi
          {
            echo "url=$url"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      # 2. 下载官方便携版(未做任何修改, 作为第三方资产随本 release 附带)
      #    并计算 sha256 校验文件,随 Release 一起发布供用户核对
      - name: Download FlClash portable and hash it
        run: |
          curl -fL "${{ steps.flclash.outputs.url }}" -o "${{ steps.flclash.outputs.name }}"
          sha256sum "${{ steps.flclash.outputs.name }}" > "${{ steps.flclash.outputs.name }}.sha256"
          cat "${{ steps.flclash.outputs.name }}.sha256"

      # 3. 发布: 附上 FlClash 便携版 + 校验文件 + GPL-3.0 全文 + 合规声明
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.flclash.outputs.name }}
            ${{ steps.flclash.outputs.name }}.sha256
            LICENSE-GPL-3.0.txt
            THIRD_PARTY_NOTICES.md
