name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 离线测试套件:纯 mock + 合成数据,不启动 FlClash、不联网
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline test suites
        run: python -B tests/run_all.py
